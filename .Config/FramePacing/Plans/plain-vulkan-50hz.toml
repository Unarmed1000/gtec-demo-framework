# Does the frame pacer work on plain Vulkan at 50 Hz? The pacer runs with the basic settings: no present feedback, no present
# that takes a time and no present fences (--VkSwapchainMaintenance1 false), so nothing of an extension takes part in the pacing. Present timing is
# on in most runs, but only to measure when the frames were shown. The runs that end in _plain switch that off as well: they prove
# that nothing depends on it, and only have the frame starts to judge by.
#
# The part that differs between the runs is what the pacer paces with (--Pacer.Kind). Core Vulkan has no call that holds a frame for
# more than one refresh, so the pacer holds such a frame by the times it says to wait until:
#   wait   a timer and the refresh period (timer-period: it is not told where the refreshes are)
#   vsync  the vertical blank times of the window system and the refresh period (vblank-period)
#
# Set the display to 50 Hz with variable refresh off before the plan is run.
#
# Pass: at least 99 % of the frames are shown for exactly their swap interval, and the frame starts are whole refreshes apart.

description = "50 Hz, plain Vulkan: the frames paced on a timer and on the vertical blank times, fixed frame rates and CPU work of 20, 90 and 130 %, each idle and under CPU load"
app = "Vulkan.FramePacing"
frames = 750
expected_refresh_hz = 50.0
args = ["--Window", "[0,0,1600,900]", "--GpuLoad", "0", "--Pacer", "--VkSwapchainMaintenance1", "false"]

[variables]
# The --CpuLoad in milliseconds that is 20, 90 and 130 % of a refresh
work20 = "4"
work90 = "18"
work130 = "26"

[load]
# One busy process for every logical CPU
processes = 0
duty = 1.0

# A fixed frame rate with light work: every frame is held for the same number of refreshes, so these runs show how well a frame is held
# and nothing else

[[run]]
name = "fps25_wait"
what = "25 fps (2 refreshes per frame), light work, paced on a timer"
args = ["--CpuLoad", "{work20}", "--Pacer.Adaptive", "false", "--Pacer.TargetFps", "25", "--Pacer.Kind", "timer-period"]
frames = 400
loaded = true

[[run]]
name = "fps25_vsync"
what = "25 fps (2 refreshes per frame), light work, paced on the vertical blank times"
args = ["--CpuLoad", "{work20}", "--Pacer.Adaptive", "false", "--Pacer.TargetFps", "25", "--Pacer.Kind", "vblank-period"]
frames = 400
loaded = true

# Work over a refresh: the adaptive pacer goes to two refreshes by itself and the frames are held under real work

[[run]]
name = "w130_wait"
what = "CPU work of 130 % of a refresh, adaptive pacer, paced on a timer"
args = ["--CpuLoad", "{work130}", "--Pacer.Kind", "timer-period"]
loaded = true

[[run]]
name = "w130_vsync"
what = "CPU work of 130 % of a refresh, adaptive pacer, paced on the vertical blank times"
args = ["--CpuLoad", "{work130}", "--Pacer.Kind", "vblank-period"]
loaded = true

# Work that fits a refresh: one refresh per frame, where the present itself holds the frame

[[run]]
name = "w20"
what = "CPU work of 20 % of a refresh, adaptive pacer"
args = ["--CpuLoad", "{work20}", "--Pacer.Kind", "vblank-period"]
loaded = true

[[run]]
name = "w90"
what = "CPU work of 90 % of a refresh, adaptive pacer"
args = ["--CpuLoad", "{work90}", "--Pacer.Kind", "vblank-period"]
loaded = true

# One and two frames in flight at work that nearly fills a refresh: with one the CPU waits for the GPU before it starts the next frame

[[run]]
name = "w90_flight1"
what = "CPU work of 90 % of a refresh, one frame in flight"
args = ["--CpuLoad", "{work90}", "--Pacer.Kind", "vblank-period", "--VkFramesInFlight", "1"]
loaded = true

[[run]]
name = "w90_flight2"
what = "CPU work of 90 % of a refresh, two frames in flight"
args = ["--CpuLoad", "{work90}", "--Pacer.Kind", "vblank-period", "--VkFramesInFlight", "2"]
loaded = true

# Fully plain: present timing is off too, so there are no display times and the frame starts are what is left to judge by

[[run]]
name = "fps25_wait_plain"
what = "25 fps (2 refreshes per frame), light work, paced on a timer, no present timing"
args = ["--CpuLoad", "{work20}", "--Pacer.Adaptive", "false", "--Pacer.TargetFps", "25", "--Pacer.Kind", "timer-period", "--VkPresentTiming", "false"]
frames = 400
loaded = true

[[run]]
name = "fps25_vsync_plain"
what = "25 fps (2 refreshes per frame), light work, paced on the vertical blank times, no present timing"
args = ["--CpuLoad", "{work20}", "--Pacer.Adaptive", "false", "--Pacer.TargetFps", "25", "--Pacer.Kind", "vblank-period", "--VkPresentTiming", "false"]
frames = 400
loaded = true

[[run]]
name = "w130_vsync_plain"
what = "CPU work of 130 % of a refresh, adaptive pacer, paced on the vertical blank times, no present timing"
args = ["--CpuLoad", "{work130}", "--Pacer.Kind", "vblank-period", "--VkPresentTiming", "false"]
loaded = true
