# Where in a refresh does a present have to be made? The sample holds a frame by a wait on the vsync of the window system and presents
# inside the refresh before the one it aims at (--Pacer.Hold vsync). --Pacer.VSyncPhase is where in that refresh, in percent. Only a part
# of a refresh is safe: too early and the frame is shown a refresh too soon, too late and it misses its refresh. This plan runs the same
# fixed frame rate with the present placed from 5 to 95 % of the refresh, so the part that is safe can be read from the runs.
#
# Run it once for every refresh rate of interest, with variable refresh off. Set the display to the rate first, then give the rate and
# half of it:
#   FramePacingCapture run vsync-phase-sweep -o <dir>/60Hz --refresh-hz 60 --set half_fps=30
#
# Pass for a run: every frame is shown for two refreshes. The phases that pass are the safe part, the default of the sample (65) should
# sit in the middle of it.

description = "One fixed refresh rate: frames held for two refreshes by a wait on the vsync, the present placed from 5 to 95 % of a refresh, each idle and under CPU load"
app = "Vulkan.FramePacing"
frames = 400
args = ["--Window", "{window}", "--CpuLoad", "0", "--GpuLoad", "16", "--Pacer", "--VkSwapchainMaintenance1", "false", "--Pacer.Adaptive", "false", "--Pacer.TargetFps", "{half_fps}", "--Pacer.Hold", "vsync"]

[variables]
# Half the refresh rate of the display in frames per second
half_fps = "120"
# Where the window is. With more than one display it selects the display the plan runs on
window = "[0,0,1600,900]"

[load]
# One busy process for every logical CPU
processes = 0
duty = 1.0

[[run]]
name = "phase05"
what = "the present at 5 % of the refresh before the target"
args = ["--Pacer.VSyncPhase", "5"]
loaded = true

[[run]]
name = "phase15"
what = "the present at 15 % of the refresh before the target"
args = ["--Pacer.VSyncPhase", "15"]
loaded = true

[[run]]
name = "phase25"
