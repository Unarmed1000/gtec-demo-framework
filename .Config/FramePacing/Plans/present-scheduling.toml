# The scheduled present at one fixed refresh rate: the presentation engine holds a frame as the present was given a target time
# (--Pacer.Hold schedule, which needs VK_EXT_present_timing with presentAtRelativeTime on the device and the surface). Every case is
# run with the scheduled present and with the timer sleep as the base line of the session. present-scheduling-240hz is the same for
# 240 Hz with a GPU load; this plan is for the rates below it, where a CPU load makes the work.
#
# Present feedback is on in every run. The pacer paces the same with it and counts what the display did, so the runs have its
# counters (pacerFeedbackLateRefreshes against pacerWindowLateFrames) for both ways of holding a frame.
#
# Run it once for every refresh rate of interest, with variable refresh off. Set the display to the rate first, then give the rate,
# half of it, a slower rate that is a whole number of frames per second, and the CPU load that is 130 % of a refresh:
#   FramePacingCapture run present-scheduling -o <dir>/120Hz --refresh-hz 120 --set half_fps=60 --set slow_fps=30 --set work130_ms=11
#   FramePacingCapture run present-scheduling -o <dir>/60Hz --refresh-hz 60 --set half_fps=30 --set slow_fps=20 --set work130_ms=22
#   FramePacingCapture run present-scheduling -o <dir>/50Hz --refresh-hz 50 --set half_fps=25 --set slow_fps=10 --set work130_ms=26
#
# Pass: at least 99 % of the frames are shown for exactly their swap interval.

description = "One fixed refresh rate: a frame held by a scheduled present and by a timer sleep, two fixed frame rates and CPU work of 130 %, present feedback on, each idle and under CPU load"
app = "Vulkan.FramePacing"
frames = 400
args = ["--Window", "{window}", "--GpuLoad", "0", "--Pacer", "--Pacer.PresentFeedback", "true"]

[variables]
# Half the refresh rate of the display in frames per second (two refreshes per frame)
half_fps = "60"
# A slower frame rate that is a whole number of refreshes per frame (three to five)
slow_fps = "30"
# The --CpuLoad in milliseconds that is 130 % of a refresh
work130_ms = "11"
# Where the window is. With more than one display it selects the display the plan runs on
window = "[0,0,1600,900]"

[load]
# One busy process for every logical CPU
processes = 0
duty = 1.0

# A fixed frame rate with light work: every frame is held for the same number of refreshes, so these runs show how well a frame is held
# and nothing else

[[run]]
name = "half_scheduled"
what = "{half_fps} fps (two refreshes per frame), light work, the present is scheduled"
args = ["--CpuLoad", "0", "--Pacer.Adaptive", "false", "--Pacer.TargetFps", "{half_fps}", "--Pacer.Hold", "schedule"]
loaded = true

[[run]]
name = "half_wait"
what = "{half_fps} fps (two refreshes per frame), light work, held by a timer sleep (the base line)"
args = ["--CpuLoad", "0", "--Pacer.Adaptive", "false", "--Pacer.TargetFps", "{half_fps}", "--Pacer.Hold", "wait"]
loaded = true

[[run]]
name = "slow_scheduled"
what = "{slow_fps} fps, light work, the present is scheduled"
args = ["--CpuLoad", "0", "--Pacer.Adaptive", "false", "--Pacer.TargetFps", "{slow_fps}", "--Pacer.Hold", "schedule"]
loaded = true

[[run]]
name = "slow_wait"
what = "{slow_fps} fps, light work, held by a timer sleep (the base line)"
args = ["--CpuLoad", "0", "--Pacer.Adaptive", "false", "--Pacer.TargetFps", "{slow_fps}", "--Pacer.Hold", "wait"]
loaded = true

# Work over a refresh: the adaptive pacer goes to two refreshes by itself and the frames are held under real work

[[run]]
name = "w130_scheduled"
what = "CPU work of 130 % of a refresh, adaptive pacer, the present is scheduled"
args = ["--CpuLoad", "{work130_ms}", "--Pacer.Hold", "schedule"]
frames = 600
loaded = true

[[run]]
name = "w130_wait"
what = "CPU work of 130 % of a refresh, adaptive pacer, held by a timer sleep (the base line)"
args = ["--CpuLoad", "{work130_ms}", "--Pacer.Hold", "wait"]
frames = 600
loaded = true
