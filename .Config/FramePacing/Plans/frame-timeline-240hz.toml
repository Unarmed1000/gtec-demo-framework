# Traces with every stage of a frame, for the charts of a frame on the timeline of the CPU, the GPU and the display:
#
#   heavy_vblank  GPU work near a refresh at one refresh per frame, paced on the vertical blank times, full screen
#   fps60_timer   60 fps on 240 Hz (four refreshes per frame), light work, paced on a timer, plain Vulkan
#   half_timed    half the refresh rate, light work, the present is given a time
#   w90           GPU work of 90 % of a refresh, adaptive pacer, plain Vulkan: where the swap interval rule slows down
#   w94_fixed1    GPU work of 94 % of a refresh at a fixed swap interval of one
#
# The last two runs are the swapchain with two images and the loop with two frames in flight.
#
# A log of these runs has, on the clock of the framework: the update, the wait for the start of the frame, the wait of the host for
# the frame slot, the acquire, the frame start, the marker, the submit, the end of the CPU work, the wait before the present, the
# present, when the GPU began and finished the frame (VK_KHR_calibrated_timestamps) and when the frame reached the display
# (VK_EXT_present_timing). The notes of a run say if one of the two extensions is missing.
#
# Set the display to 240 Hz with variable refresh off before the plan is run. The GPU load settings depend on the GPU and on the size
# of the window, so measure them first, for the window and for the full screen:
#   FramePacingCapture calibrate --window [0,0,1600,900] --percent 20,90,94
#   FramePacingCapture calibrate --window [] --percent 83
#   FramePacingCapture run frame-timeline-240hz -o <dir> --set work20=.. --set work90=.. --set work94=.. --set heavy_fullscreen=..

description = "240 Hz: every stage of a frame in the log for five cases, two swapchain images and two frames in flight"
app = "Vulkan.FramePacing"
frames = 2400
expected_refresh_hz = 240.0
# The scene is named, as the GPU load settings below are the ones of that scene
args = ["--Background", "flight", "--CpuLoad", "0", "--Pacer"]

[variables]
# The --GpuLoad that makes the GPU work 20, 90 and 94 % of a refresh on a frame in the window (the defaults were measured on a
# NVIDIA desktop GPU with a display of 3840x2160)
work20 = "105"
work90 = "485"
work94 = "508"
# The --GpuLoad that makes the GPU work about 83 % of a refresh on a frame in full screen
heavy_fullscreen = "78"
# Where the window is. With more than one display it selects the display the plan runs on
window = "[0,0,1600,900]"

# The five cases

[[run]]
name = "heavy_vblank"
what = "Full screen, GPU work near a refresh, adaptive pacer, paced on the vertical blank times"
args = ["--Window", "[]", "--GpuLoad", "{heavy_fullscreen}", "--Pacer.Kind", "vblank-period"]

[[run]]
name = "fps60_timer"
what = "60 fps (4 refreshes per frame), light work, paced on a timer, plain Vulkan"
args = ["--Window", "{window}", "--GpuLoad", "{work20}", "--Pacer.Adaptive", "false", "--Pacer.TargetFps", "60", "--Pacer.Kind", "timer-period",
        "--VkSwapchainMaintenance1", "false"]
frames = 600

[[run]]
name = "half_timed"
what = "120 fps (2 refreshes per frame), light work, the present is given a time"
args = ["--Window", "{window}", "--GpuLoad", "{work20}", "--Pacer.DisplayReports", "true", "--Pacer.Adaptive", "false", "--Pacer.TargetFps", "120",
        "--Pacer.Kind", "timer-period", "--Pacer.TimedPresent"]
frames = 1200

[[run]]
name = "w90"
what = "GPU work of 90 % of a refresh, adaptive pacer, plain Vulkan"
args = ["--Window", "{window}", "--GpuLoad", "{work90}", "--Pacer.Kind", "vblank-period", "--VkSwapchainMaintenance1", "false"]

[[run]]
name = "w94_fixed1"
what = "GPU work of 94 % of a refresh at a fixed swap interval of one"
args = ["--Window", "{window}", "--GpuLoad", "{work94}", "--Pacer.Adaptive", "false", "--Pacer.Kind", "timer-period"]

# The swapchain and the frames in flight, at work of 90 %

[[run]]
name = "w90_images2"
what = "GPU work of 90 % of a refresh, adaptive pacer, a swapchain with two images"
args = ["--Window", "{window}", "--GpuLoad", "{work90}", "--Pacer.Kind", "vblank-period", "--VkSwapchainMaintenance1", "false", "--VkSwapchainImages", "2"]

[[run]]
name = "w90_flight2"
what = "GPU work of 90 % of a refresh, adaptive pacer, two frames in flight"
args = ["--Window", "{window}", "--GpuLoad", "{work90}", "--Pacer.Kind", "vblank-period", "--VkSwapchainMaintenance1", "false", "--VkFramesInFlight", "2"]
